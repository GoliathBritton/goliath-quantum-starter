name: lead_scoring_pipeline
description: Automated lead scoring and qualification workflow
version: "1.0"
author: Quantum Nexus Engine
created_at: "2024-01-15T00:00:00Z"

triggers:
  - type: webhook
    endpoint: "/api/workflows/lead-scoring"
    method: POST
  - type: schedule
    cron: "0 */6 * * *"  # Every 6 hours
  - type: event
    source: "lead.created"

inputs:
  - name: lead_data
    type: object
    required: true
    schema:
      type: object
      properties:
        id:
          type: string
        company:
          type: string
        industry:
          type: string
        company_size:
          type: string
          enum: ["startup", "small", "medium", "large", "enterprise"]
        budget:
          type: number
        timeline:
          type: string
        contact_email:
          type: string
        contact_phone:
          type: string
        engagement_level:
          type: number
          minimum: 0
          maximum: 10

steps:
  - name: validate_lead_data
    type: data_transform
    description: "Validate and normalize incoming lead data"
    transform: "validate_lead"
    input_key: "lead_data"
    output_key: "validated_lead"
    validation_rules:
      - field: "company"
        required: true
        min_length: 2
      - field: "contact_email"
        required: true
        format: "email"
    continue_on_error: false

  - name: enrich_lead_data
    type: api_call
    description: "Enrich lead data from external sources"
    endpoint: "/api/leads/enrich"
    method: POST
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer ${API_TOKEN}"
    body:
      lead_id: "${validated_lead.id}"
      sources: ["linkedin", "clearbit", "zoominfo"]
    output_key: "enriched_data"
    timeout: 30
    retry_count: 3
    continue_on_error: true

  - name: quantum_score_calculation
    type: quantum_process
    description: "Calculate quantum-enhanced lead score"
    process: "optimization"
    parameters:
      algorithm: "quantum_annealing"
      iterations: 1000
      temperature_schedule: "linear"
      scoring_factors:
        - name: "company_size_weight"
          range: [0.1, 0.4]
        - name: "budget_weight"
          range: [0.2, 0.5]
        - name: "timeline_weight"
          range: [0.1, 0.3]
        - name: "engagement_weight"
          range: [0.2, 0.4]
    input_data:
      lead: "${validated_lead}"
      enrichment: "${enriched_data}"
    output_key: "quantum_score"
    timeout: 60

  - name: determine_lead_quality
    type: condition
    description: "Determine lead quality based on score"
    condition: "quantum_score.final_score >= 70"
    true_branch:
      - name: "mark_as_hot_lead"
        type: "data_transform"
        transform: "set_quality"
        parameters:
          quality: "hot"
          priority: "high"
          next_action: "immediate_follow_up"
    false_branch:
      - name: "check_warm_lead"
        type: "condition"
        condition: "quantum_score.final_score >= 50"
        true_branch:
          - name: "mark_as_warm_lead"
            type: "data_transform"
            transform: "set_quality"
            parameters:
              quality: "warm"
              priority: "medium"
              next_action: "schedule_demo"
        false_branch:
          - name: "mark_as_cold_lead"
            type: "data_transform"
            transform: "set_quality"
            parameters:
              quality: "cold"
              priority: "low"
              next_action: "nurture_campaign"

  - name: update_crm_record
    type: api_call
    description: "Update CRM with scoring results"
    endpoint: "/api/crm/leads/${validated_lead.id}"
    method: PATCH
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer ${CRM_API_TOKEN}"
    body:
      score: "${quantum_score.final_score}"
      quality: "${lead_quality.quality}"
      priority: "${lead_quality.priority}"
      quantum_enhancement: "${quantum_score.quantum_advantage}"
      last_scored: "${current_timestamp}"
      scoring_factors: "${quantum_score.scoring_factors}"
    timeout: 15
    retry_count: 2

  - name: generate_insights
    type: api_call
    description: "Generate AI-powered lead insights"
    endpoint: "/api/ai/insights/generate"
    method: POST
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer ${AI_API_TOKEN}"
    body:
      lead_data: "${validated_lead}"
      enrichment_data: "${enriched_data}"
      scoring_result: "${quantum_score}"
      quality_assessment: "${lead_quality}"
    output_key: "ai_insights"
    timeout: 45
    continue_on_error: true

  - name: notify_sales_team
    type: condition
    description: "Notify sales team for high-quality leads"
    condition: "lead_quality.quality in ['hot', 'warm']"
    true_branch:
      - name: "send_sales_notification"
        type: "notification"
        notification_type: "email"
        recipients:
          - "sales-team@company.com"
          - "${lead_quality.assigned_rep}"
        template: "new_qualified_lead"
        data:
          lead: "${validated_lead}"
          score: "${quantum_score.final_score}"
          quality: "${lead_quality.quality}"
          insights: "${ai_insights}"
          next_action: "${lead_quality.next_action}"
        priority: "high"
      - name: "create_sales_task"
        type: "api_call"
        endpoint: "/api/tasks/create"
        method: POST
        body:
          title: "Follow up with ${validated_lead.company}"
          description: "High-quality lead scored ${quantum_score.final_score}. ${lead_quality.next_action}"
          assignee: "${lead_quality.assigned_rep}"
          priority: "${lead_quality.priority}"
          due_date: "${calculate_due_date(lead_quality.priority)}"
          lead_id: "${validated_lead.id}"

  - name: schedule_follow_up
    type: condition
    description: "Schedule appropriate follow-up based on lead quality"
    condition: "lead_quality.quality == 'hot'"
    true_branch:
      - name: "schedule_immediate_call"
        type: "api_call"
        endpoint: "/api/calendar/schedule"
        method: POST
        body:
          type: "sales_call"
          lead_id: "${validated_lead.id}"
          priority: "urgent"
          suggested_times: "${get_next_available_slots(2)}"
          duration: 30
    false_branch:
      - name: "add_to_nurture_sequence"
        type: "api_call"
        endpoint: "/api/marketing/sequences/add"
        method: POST
        body:
          lead_id: "${validated_lead.id}"
          sequence_type: "${lead_quality.quality}_lead_nurture"
          personalization_data:
            company: "${validated_lead.company}"
            industry: "${validated_lead.industry}"
            score: "${quantum_score.final_score}"

  - name: log_workflow_completion
    type: api_call
    description: "Log workflow completion for analytics"
    endpoint: "/api/analytics/workflows/log"
    method: POST
    body:
      workflow_name: "lead_scoring_pipeline"
      lead_id: "${validated_lead.id}"
      execution_time: "${workflow_duration}"
      final_score: "${quantum_score.final_score}"
      quality: "${lead_quality.quality}"
      quantum_enhancement: "${quantum_score.quantum_advantage}"
      steps_completed: "${completed_steps_count}"
      errors: "${error_count}"
    continue_on_error: true

outputs:
  - name: scoring_result
    description: "Complete lead scoring results"
    value:
      lead_id: "${validated_lead.id}"
      score: "${quantum_score.final_score}"
      quality: "${lead_quality.quality}"
      priority: "${lead_quality.priority}"
      quantum_enhancement: "${quantum_score.quantum_advantage}"
      insights: "${ai_insights}"
      next_action: "${lead_quality.next_action}"
      scored_at: "${current_timestamp}"

error_handling:
  on_step_failure:
    - log_error: true
    - notify_admin: true
    - continue_workflow: false
  on_timeout:
    - retry_count: 2
    - escalate_after: 3
  on_validation_error:
    - return_error: true
    - log_details: true

monitoring:
  metrics:
    - name: "execution_time"
      type: "duration"
    - name: "success_rate"
      type: "percentage"
    - name: "average_score"
      type: "number"
    - name: "quality_distribution"
      type: "histogram"
  alerts:
    - condition: "execution_time > 300"
      severity: "warning"
      message: "Lead scoring workflow taking longer than expected"
    - condition: "success_rate < 0.95"
      severity: "critical"
      message: "Lead scoring workflow failure rate too high"

retention:
  execution_logs: 30  # days
  metrics_data: 90   # days
  error_logs: 180    # days