# External Secrets Operator Configuration
# Manages secrets from AWS Secrets Manager, Parameter Store, and other external sources

apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    name: external-secrets
    app.kubernetes.io/name: external-secrets
---
# ServiceAccount for External Secrets Operator with IRSA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/external-secrets-operator
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: controller
---
# ClusterSecretStore for AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  namespace: external-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# ClusterSecretStore for AWS Parameter Store
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
  namespace: external-secrets
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# External Secret for Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: goliath-quantum
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .database }}"
        DB_USERNAME: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
        DB_HOST: "{{ .host }}"
        DB_PORT: "{{ .port }}"
        DB_NAME: "{{ .database }}"
  data:
  - secretKey: username
    remoteRef:
      key: goliath-quantum/database
      property: username
  - secretKey: password
    remoteRef:
      key: goliath-quantum/database
      property: password
  - secretKey: host
    remoteRef:
      key: goliath-quantum/database
      property: host
  - secretKey: port
    remoteRef:
      key: goliath-quantum/database
      property: port
  - secretKey: database
    remoteRef:
      key: goliath-quantum/database
      property: database
---
# External Secret for Redis Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: goliath-quantum
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        REDIS_URL: "redis://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .database }}"
        REDIS_HOST: "{{ .host }}"
        REDIS_PORT: "{{ .port }}"
        REDIS_PASSWORD: "{{ .password }}"
        REDIS_DATABASE: "{{ .database }}"
  data:
  - secretKey: host
    remoteRef:
      key: goliath-quantum/redis
      property: host
  - secretKey: port
    remoteRef:
      key: goliath-quantum/redis
      property: port
  - secretKey: password
    remoteRef:
      key: goliath-quantum/redis
      property: password
  - secretKey: database
    remoteRef:
      key: goliath-quantum/redis
      property: database
  - secretKey: username
    remoteRef:
      key: goliath-quantum/redis
      property: username
---
# External Secret for Dynex API Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dynex-credentials
  namespace: goliath-quantum
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: dynex-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DYNEX_API_KEY: "{{ .api_key }}"
        DYNEX_API_SECRET: "{{ .api_secret }}"
        DYNEX_ENDPOINT: "{{ .endpoint }}"
        DYNEX_TIMEOUT: "{{ .timeout }}"
  data:
  - secretKey: api_key
    remoteRef:
      key: goliath-quantum/dynex
      property: api_key
  - secretKey: api_secret
    remoteRef:
      key: goliath-quantum/dynex
      property: api_secret
  - secretKey: endpoint
    remoteRef:
      key: goliath-quantum/dynex
      property: endpoint
  - secretKey: timeout
    remoteRef:
      key: goliath-quantum/dynex
      property: timeout
---
# External Secret for JWT and Auth Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-secrets
  namespace: goliath-quantum
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        JWT_ALGORITHM: "{{ .jwt_algorithm }}"
        JWT_EXPIRATION: "{{ .jwt_expiration }}"
        NEXTAUTH_SECRET: "{{ .nextauth_secret }}"
        NEXTAUTH_URL: "{{ .nextauth_url }}"
        OAUTH_CLIENT_ID: "{{ .oauth_client_id }}"
        OAUTH_CLIENT_SECRET: "{{ .oauth_client_secret }}"
  data:
  - secretKey: jwt_secret
    remoteRef:
      key: goliath-quantum/auth
      property: jwt_secret
  - secretKey: jwt_algorithm
    remoteRef:
      key: goliath-quantum/auth
      property: jwt_algorithm
  - secretKey: jwt_expiration
    remoteRef:
      key: goliath-quantum/auth
      property: jwt_expiration
  - secretKey: nextauth_secret
    remoteRef:
      key: goliath-quantum/auth
      property: nextauth_secret
  - secretKey: nextauth_url
    remoteRef:
      key: goliath-quantum/auth
      property: nextauth_url
  - secretKey: oauth_client_id
    remoteRef:
      key: goliath-quantum/auth
      property: oauth_client_id
  - secretKey: oauth_client_secret
    remoteRef:
      key: goliath-quantum/auth
      property: oauth_client_secret
---
# External Secret for Stripe Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stripe-credentials
  namespace: goliath-quantum
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: stripe-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        STRIPE_SECRET_KEY: "{{ .secret_key }}"
        STRIPE_PUBLISHABLE_KEY: "{{ .publishable_key }}"
        STRIPE_WEBHOOK_SECRET: "{{ .webhook_secret }}"
        STRIPE_CONNECT_CLIENT_ID: "{{ .connect_client_id }}"
  data:
  - secretKey: secret_key
    remoteRef:
      key: goliath-quantum/stripe
      property: secret_key
  - secretKey: publishable_key
    remoteRef:
      key: goliath-quantum/stripe
      property: publishable_key
  - secretKey: webhook_secret
    remoteRef:
      key: goliath-quantum/stripe
      property: webhook_secret
  - secretKey: connect_client_id
    remoteRef:
      key: goliath-quantum/stripe
      property: connect_client_id
---
# External Secret for Monitoring Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: monitoring-credentials
  namespace: monitoring
spec:
  refreshInterval: 2h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: monitoring-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        GRAFANA_ADMIN_PASSWORD: "{{ .grafana_admin_password }}"
        GRAFANA_SECRET_KEY: "{{ .grafana_secret_key }}"
        PROMETHEUS_BASIC_AUTH: "{{ .prometheus_basic_auth }}"
        SENTRY_DSN: "{{ .sentry_dsn }}"
        SENTRY_AUTH_TOKEN: "{{ .sentry_auth_token }}"
        SLACK_WEBHOOK_URL: "{{ .slack_webhook_url }}"
        PAGERDUTY_INTEGRATION_KEY: "{{ .pagerduty_integration_key }}"
  data:
  - secretKey: grafana_admin_password
    remoteRef:
      key: goliath-quantum/monitoring
      property: grafana_admin_password
  - secretKey: grafana_secret_key
    remoteRef:
      key: goliath-quantum/monitoring
      property: grafana_secret_key
  - secretKey: prometheus_basic_auth
    remoteRef:
      key: goliath-quantum/monitoring
      property: prometheus_basic_auth
  - secretKey: sentry_dsn
    remoteRef:
      key: goliath-quantum/monitoring
      property: sentry_dsn
  - secretKey: sentry_auth_token
    remoteRef:
      key: goliath-quantum/monitoring
      property: sentry_auth_token
  - secretKey: slack_webhook_url
    remoteRef:
      key: goliath-quantum/monitoring
      property: slack_webhook_url
  - secretKey: pagerduty_integration_key
    remoteRef:
      key: goliath-quantum/monitoring
      property: pagerduty_integration_key
---
# External Secret for Application Configuration
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-config
  namespace: goliath-quantum
spec:
  refreshInterval: 4h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: app-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        LOG_LEVEL: "{{ .log_level }}"
        DEBUG_MODE: "{{ .debug_mode }}"
        CORS_ORIGINS: "{{ .cors_origins }}"
        RATE_LIMIT_REQUESTS: "{{ .rate_limit_requests }}"
        RATE_LIMIT_WINDOW: "{{ .rate_limit_window }}"
        MAX_UPLOAD_SIZE: "{{ .max_upload_size }}"
        SESSION_TIMEOUT: "{{ .session_timeout }}"
        CACHE_TTL: "{{ .cache_ttl }}"
  data:
  - secretKey: log_level
    remoteRef:
      key: /goliath-quantum/config/log_level
  - secretKey: debug_mode
    remoteRef:
      key: /goliath-quantum/config/debug_mode
  - secretKey: cors_origins
    remoteRef:
      key: /goliath-quantum/config/cors_origins
  - secretKey: rate_limit_requests
    remoteRef:
      key: /goliath-quantum/config/rate_limit_requests
  - secretKey: rate_limit_window
    remoteRef:
      key: /goliath-quantum/config/rate_limit_window
  - secretKey: max_upload_size
    remoteRef:
      key: /goliath-quantum/config/max_upload_size
  - secretKey: session_timeout
    remoteRef:
      key: /goliath-quantum/config/session_timeout
  - secretKey: cache_ttl
    remoteRef:
      key: /goliath-quantum/config/cache_ttl
---
# SecretStore for development environment (namespace-scoped)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: dev-secrets
  namespace: goliath-quantum-dev
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# NetworkPolicy for External Secrets
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: external-secrets-network-policy
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443  # HTTPS to AWS APIs
    - protocol: TCP
      port: 53   # DNS
    - protocol: UDP
      port: 53   # DNS
---
# PodDisruptionBudget for External Secrets
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: external-secrets-pdb
  namespace: external-secrets
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/instance: external-secrets
---
# ServiceMonitor for External Secrets
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-secrets
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
# PrometheusRule for External Secrets Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets-alerts
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
spec:
  groups:
  - name: external-secrets
    rules:
    - alert: ExternalSecretSyncFailure
      expr: increase(externalsecrets_sync_calls_error_total[5m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "External Secret sync failure"
        description: "External Secret {{ $labels.name }} in namespace {{ $labels.namespace }} failed to sync"
    
    - alert: ExternalSecretStale
      expr: time() - externalsecrets_sync_calls_success_time > 7200  # 2 hours
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "External Secret is stale"
        description: "External Secret {{ $labels.name }} in namespace {{ $labels.namespace }} hasn't been synced for over 2 hours"