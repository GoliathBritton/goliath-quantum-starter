# Cert-Manager Installation and Configuration
# Manages SSL/TLS certificates automatically

apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    name: cert-manager
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: cert-manager
---
# Cert-Manager CRDs and Controller
# Note: In production, install cert-manager using Helm:
# helm repo add jetstack https://charts.jetstack.io
# helm repo update
# helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --version v1.13.0 --set installCRDs=true

# ClusterIssuer for Let's Encrypt (Production)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  namespace: cert-manager
spec:
  acme:
    # ACME server URL for Let's Encrypt's prod environment
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: admin@goliath-quantum.com
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod
    # Enable the HTTP-01 challenge provider
    solvers:
    - http01:
        ingress:
          class: alb
    # Enable DNS-01 challenge provider for wildcard certificates
    - dns01:
        route53:
          region: us-west-2
          # IAM role for Route53 access (configured via IRSA)
          role: arn:aws:iam::ACCOUNT_ID:role/cert-manager-route53
      selector:
        dnsZones:
        - "goliath-quantum.com"
---
# ClusterIssuer for Let's Encrypt (Staging)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  namespace: cert-manager
spec:
  acme:
    # ACME server URL for Let's Encrypt's staging environment
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: admin@goliath-quantum.com
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-staging
    # Enable the HTTP-01 challenge provider
    solvers:
    - http01:
        ingress:
          class: alb
    # Enable DNS-01 challenge provider
    - dns01:
        route53:
          region: us-west-2
          role: arn:aws:iam::ACCOUNT_ID:role/cert-manager-route53
      selector:
        dnsZones:
        - "goliath-quantum.com"
---
# ServiceAccount for cert-manager with IRSA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager
  namespace: cert-manager
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/cert-manager-route53
---
# IAM Role for Route53 access (to be created via Terraform)
# This is a reference - the actual role is created in Terraform
apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-manager-iam-policy
  namespace: cert-manager
data:
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "route53:GetChange",
            "route53:ChangeResourceRecordSets",
            "route53:ListResourceRecordSets"
          ],
          "Resource": [
            "arn:aws:route53:::hostedzone/*",
            "arn:aws:route53:::change/*"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "route53:ListHostedZonesByName",
            "route53:ListHostedZones"
          ],
          "Resource": "*"
        }
      ]
    }
---
# Certificate for main domain
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: goliath-quantum-tls
  namespace: goliath-quantum
spec:
  secretName: goliath-quantum-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - goliath-quantum.com
  - www.goliath-quantum.com
  - api.goliath-quantum.com
  - grafana.goliath-quantum.com
  - prometheus.goliath-quantum.com
---
# Wildcard certificate for subdomains
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: goliath-quantum-wildcard-tls
  namespace: goliath-quantum
spec:
  secretName: goliath-quantum-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - "*.goliath-quantum.com"
  - goliath-quantum.com
---
# Certificate renewal monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: cert-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/instance: cert-manager
  endpoints:
  - port: http-metrics
    interval: 60s
    path: /metrics
---
# NetworkPolicy for cert-manager
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-network-policy
  namespace: cert-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9402
  egress:
  - {} # Allow all egress for ACME challenges
---
# PodDisruptionBudget for cert-manager
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cert-manager-pdb
  namespace: cert-manager
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/instance: cert-manager