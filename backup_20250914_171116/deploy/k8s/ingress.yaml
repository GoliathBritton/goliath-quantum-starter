# AWS Load Balancer Controller and Ingress Configuration
# Manages ALB/NLB for EKS clusters

apiVersion: v1
kind: Namespace
metadata:
  name: aws-load-balancer-controller
  labels:
    name: aws-load-balancer-controller
---
# ServiceAccount for AWS Load Balancer Controller with IRSA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/aws-load-balancer-controller
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
    app.kubernetes.io/component: controller
---
# ClusterRole for AWS Load Balancer Controller
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aws-load-balancer-controller
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
rules:
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["patch", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "patch", "update", "watch"]
- apiGroups: [""]
  resources: ["services/status"]
  verbs: ["patch", "update"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "patch", "update", "watch"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources: ["ingresses/status"]
  verbs: ["patch", "update"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingressclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["elbv2.k8s.aws"]
  resources: ["targetgroupbindings"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["elbv2.k8s.aws"]
  resources: ["targetgroupbindings/status"]
  verbs: ["patch", "update"]
---
# ClusterRoleBinding for AWS Load Balancer Controller
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aws-load-balancer-controller
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aws-load-balancer-controller
subjects:
- kind: ServiceAccount
  name: aws-load-balancer-controller
  namespace: aws-load-balancer-controller
---
# IngressClass for ALB
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
spec:
  controller: ingress.k8s.aws/alb
---
# Main Application Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goliath-quantum-ingress
  namespace: goliath-quantum
  annotations:
    # ALB Configuration
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: goliath-quantum-alb
    
    # SSL Configuration
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:ACCOUNT_ID:certificate/CERTIFICATE_ID
    
    # Health Check Configuration
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    
    # Security Configuration
    alb.ingress.kubernetes.io/security-groups: sg-xxxxxxxxx
    alb.ingress.kubernetes.io/subnets: subnet-xxxxxxxxx,subnet-yyyyyyyyy
    
    # Performance Configuration
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      idle_timeout.timeout_seconds=60,
      routing.http2.enabled=true,
      access_logs.s3.enabled=true,
      access_logs.s3.bucket=goliath-quantum-alb-logs,
      access_logs.s3.prefix=alb-logs
    
    # WAF Configuration
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-west-2:ACCOUNT_ID:regional/webacl/goliath-quantum-waf/WEBACL_ID
    
    # Tags
    alb.ingress.kubernetes.io/tags: |
      Environment=production,
      Project=goliath-quantum,
      ManagedBy=kubernetes,
      CostCenter=engineering
spec:
  ingressClassName: alb
  tls:
  - hosts:
    - goliath-quantum.com
    - www.goliath-quantum.com
    - api.goliath-quantum.com
    secretName: goliath-quantum-tls
  rules:
  # Frontend Portal
  - host: goliath-quantum.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: goliath-quantum-portal
            port:
              number: 3000
  - host: www.goliath-quantum.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: goliath-quantum-portal
            port:
              number: 3000
  
  # API Backend
  - host: api.goliath-quantum.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: goliath-quantum-api
            port:
              number: 8080
  
  # Health Check Endpoint
  - host: goliath-quantum.com
    http:
      paths:
      - path: /health
        pathType: Exact
        backend:
          service:
            name: goliath-quantum-api
            port:
              number: 8080
---
# Monitoring Ingress (Internal)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goliath-quantum-monitoring-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: goliath-quantum-monitoring-alb
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:ACCOUNT_ID:certificate/CERTIFICATE_ID
    alb.ingress.kubernetes.io/security-groups: sg-monitoring-xxxxxxxxx
    alb.ingress.kubernetes.io/subnets: subnet-private-xxxxxxxxx,subnet-private-yyyyyyyyy
    
    # Basic Auth for monitoring endpoints
    alb.ingress.kubernetes.io/auth-type: cognito
    alb.ingress.kubernetes.io/auth-idp-cognito: |
      {
        "userPoolArn": "arn:aws:cognito-idp:us-west-2:ACCOUNT_ID:userpool/us-west-2_XXXXXXXXX",
        "userPoolClientId": "XXXXXXXXXXXXXXXXXXXXXXXXXX",
        "userPoolDomain": "goliath-quantum-auth"
      }
spec:
  ingressClassName: alb
  tls:
  - hosts:
    - grafana.goliath-quantum.com
    - prometheus.goliath-quantum.com
    secretName: goliath-quantum-wildcard-tls
  rules:
  # Grafana
  - host: grafana.goliath-quantum.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
  
  # Prometheus
  - host: prometheus.goliath-quantum.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-server
            port:
              number: 9090
---
# Network Policy for Ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-network-policy
  namespace: goliath-quantum
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: aws-load-balancer-controller
    - namespaceSelector:
        matchLabels:
          name: kube-system
  - from: []
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8000
---
# HorizontalPodAutoscaler for Load Balancer Controller
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aws-load-balancer-controller-hpa
  namespace: aws-load-balancer-controller
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aws-load-balancer-controller
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max