apiVersion: v1
kind: Secret
metadata:
  name: partner-secrets
  namespace: partner-system
type: Opaque
data:
  # Base64 encoded values - replace with actual secrets
  DATABASE_URL: <BASE64_ENCODED_DATABASE_URL>
  DYNEX_API_KEY: <BASE64_ENCODED_DYNEX_API_KEY>
  STRIPE_SECRET_KEY: <BASE64_ENCODED_STRIPE_SECRET>
  SENTRY_DSN: <BASE64_ENCODED_SENTRY_DSN>
  JWT_SECRET: <BASE64_ENCODED_JWT_SECRET>
  REDIS_URL: <BASE64_ENCODED_REDIS_URL>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: partner-config
  namespace: partner-system
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  API_VERSION: "v1"
  CORS_ORIGIN: "https://partners.goliathomniedge.com"