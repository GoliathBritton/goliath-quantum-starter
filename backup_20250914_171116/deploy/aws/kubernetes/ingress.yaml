apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: partner-ingress
  namespace: partner-system
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    - host: partners.goliathomniedge.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: partner-portal
                port:
                  number: 3000
    - host: api.goliathomniedge.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: partner-api
                port:
                  number: 8080