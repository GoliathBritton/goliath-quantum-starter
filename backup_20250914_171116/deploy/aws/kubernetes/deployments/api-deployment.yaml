apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-api
  namespace: partner-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: partner-api
  template:
    metadata:
      labels:
        app: partner-api
    spec:
      containers:
      - name: partner-api
        image: <AWS_ACCOUNT>.dkr.ecr.us-east-1.amazonaws.com/flyfox-partner-api:latest
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: partner-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10