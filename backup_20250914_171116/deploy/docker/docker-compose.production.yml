# Quantum Nexus Platform - Production Docker Compose
# Enhanced with Redis, DynamoDB integration, and NATS for async job queuing

version: '3.8'

services:
  # =============================================================================
  # Core API Service
  # =============================================================================
  quantum-nexus-api:
    build:
      context: ../../
      dockerfile: api/Dockerfile.production
      args:
        BUILD_ENV: production
        PYTHON_VERSION: 3.11
    image: quantum-nexus/api:${VERSION:-latest}
    container_name: quantum-nexus-api
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9090:9090"  # Metrics
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - SECRET_KEY=${SECRET_KEY}
      - DYNEX_API_KEY=${DYNEX_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DYNAMODB_TABLE_PREFIX=${DYNAMODB_TABLE_PREFIX:-quantum-nexus}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    volumes:
      - api_logs:/app/logs
      - api_cache:/app/cache
      - prometheus_data:/tmp/prometheus
    networks:
      - quantum-nexus-network
    depends_on:
      - redis
      - nats
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # =============================================================================
  # Quantum Worker Services
  # =============================================================================
  quantum-nexus-worker:
    build:
      context: ../../
      dockerfile: worker/Dockerfile.production
      args:
        BUILD_ENV: production
        PYTHON_VERSION: 3.11
    image: quantum-nexus/worker:${VERSION:-latest}
    container_name: quantum-nexus-worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - WORKER_TYPE=quantum
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - DYNEX_API_KEY=${DYNEX_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DYNAMODB_TABLE_PREFIX=${DYNAMODB_TABLE_PREFIX:-quantum-nexus}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - worker_data:/app/data
      - worker_logs:/app/logs
      - prometheus_data:/tmp/prometheus
    networks:
      - quantum-nexus-network
    depends_on:
      - redis
      - nats
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s

  quantum-nexus-worker-batch:
    build:
      context: ../../
      dockerfile: worker/Dockerfile.production
      args:
        BUILD_ENV: production
        PYTHON_VERSION: 3.11
    image: quantum-nexus/worker:${VERSION:-latest}
    container_name: quantum-nexus-worker-batch
    restart: unless-stopped
    command: ["celery", "-A", "nqba_stack.worker", "worker", "--loglevel=info", "--queues=batch,quantum_batch", "--concurrency=4"]
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - WORKER_TYPE=batch
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - DYNEX_API_KEY=${DYNEX_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DYNAMODB_TABLE_PREFIX=${DYNAMODB_TABLE_PREFIX:-quantum-nexus}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - worker_batch_data:/app/data
      - worker_logs:/app/logs
    networks:
      - quantum-nexus-network
    depends_on:
      - redis
      - nats
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '2.0'
          memory: 4G

  # =============================================================================
  # Redis Cache & Session Store
  # =============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: quantum-nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - quantum-nexus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.2'
          memory: 512M

  # =============================================================================
  # NATS Message Queue
  # =============================================================================
  nats:
    image: nats:2.10-alpine
    container_name: quantum-nexus-nats
    restart: unless-stopped
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
      - "6222:6222"  # Cluster connections
    command: >
      --jetstream
      --store_dir=/data
      --max_file_store=10GB
      --max_mem_store=1GB
      --http_port=8222
      --cluster_name=quantum-nexus
      --cluster=nats://0.0.0.0:6222
    volumes:
      - nats_data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - quantum-nexus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.1'
          memory: 256M

  # =============================================================================
  # Monitoring & Observability
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: quantum-nexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_storage:/prometheus
    networks:
      - quantum-nexus-network
    depends_on:
      - quantum-nexus-api
      - quantum-nexus-worker
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.2'
          memory: 512M

  grafana:
    image: grafana/grafana:10.1.0
    container_name: quantum-nexus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-quantum-nexus-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource,natel-discrete-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - quantum-nexus-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M

  jaeger:
    image: jaegertracing/all-in-one:1.49
    container_name: quantum-nexus-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "6831:6831/udp"  # Jaeger agent UDP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    networks:
      - quantum-nexus-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M

  # =============================================================================
  # Nginx Reverse Proxy
  # =============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: quantum-nexus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - quantum-nexus-network
    depends_on:
      - quantum-nexus-api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

# =============================================================================
# Networks
# =============================================================================
networks:
  quantum-nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis_data:
    driver: local
  nats_data:
    driver: local
  api_logs:
    driver: local
  api_cache:
    driver: local
  worker_data:
    driver: local
  worker_batch_data:
    driver: local
  worker_logs:
    driver: local
  prometheus_data:
    driver: local
  prometheus_storage:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local