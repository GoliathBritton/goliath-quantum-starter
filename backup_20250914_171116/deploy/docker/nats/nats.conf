# Quantum Nexus Platform - NATS Configuration
# Production-ready NATS server configuration for async job queuing

# =============================================================================
# Server Configuration
# =============================================================================
server_name: "quantum-nexus-nats"
port: 4222
http_port: 8222

# =============================================================================
# Logging Configuration
# =============================================================================
log_file: "/data/nats.log"
log_size_limit: 100MB
max_traced_msg_len: 1024
trace: false
debug: false
logtime: true

# =============================================================================
# Connection Limits
# =============================================================================
max_connections: 10000
max_control_line: 4096
max_payload: 8MB
max_pending: 256MB

# =============================================================================
# Timeouts
# =============================================================================
ping_interval: "2m"
ping_max: 2
write_deadline: "10s"

# =============================================================================
# JetStream Configuration
# =============================================================================
jetstream {
    # Storage directory
    store_dir: "/data/jetstream"
    
    # Memory and file store limits
    max_memory_store: 1GB
    max_file_store: 10GB
    
    # Domain configuration
    domain: "quantum-nexus"
    
    # Limits
    limits {
        max_ha_assets: 100
        max_api_request: 1MB
    }
}

# =============================================================================
# Cluster Configuration
# =============================================================================
cluster {
    name: "quantum-nexus-cluster"
    listen: "0.0.0.0:6222"
    
    # Authorization
    authorization {
        user: "cluster_user"
        password: "$NATS_CLUSTER_PASSWORD"
        timeout: 2
    }
    
    # Routes for clustering (add other NATS servers here)
    routes = [
        # "nats://nats-1:6222"
        # "nats://nats-2:6222"
    ]
    
    # Cluster advertise
    cluster_advertise: "quantum-nexus-nats:6222"
    
    # No auth timeout
    no_advertise: false
}

# =============================================================================
# Authentication & Authorization
# =============================================================================
authorization {
    # Default permissions
    default_permissions {
        publish {
            allow: ["quantum.>"]
        }
        subscribe {
            allow: ["quantum.>"]
        }
    }
    
    # Users configuration
    users = [
        {
            user: "quantum_api"
            password: "$NATS_API_PASSWORD"
            permissions {
                publish {
                    allow: ["quantum.jobs.>", "quantum.events.>", "quantum.metrics.>"]
                }
                subscribe {
                    allow: ["quantum.results.>", "quantum.status.>", "quantum.events.>"]
                }
            }
        },
        {
            user: "quantum_worker"
            password: "$NATS_WORKER_PASSWORD"
            permissions {
                publish {
                    allow: ["quantum.results.>", "quantum.status.>", "quantum.metrics.>"]
                }
                subscribe {
                    allow: ["quantum.jobs.>", "quantum.events.>"]
                }
            }
        },
        {
            user: "quantum_monitor"
            password: "$NATS_MONITOR_PASSWORD"
            permissions {
                publish {
                    deny: [">"]  # Read-only user
                }
                subscribe {
                    allow: ["quantum.>", "$SYS.>"]
                }
            }
        }
    ]
}

# =============================================================================
# TLS Configuration (for production)
# =============================================================================
# Uncomment and configure for production TLS
# tls {
#     cert_file: "/etc/nats/certs/server.crt"
#     key_file: "/etc/nats/certs/server.key"
#     ca_file: "/etc/nats/certs/ca.crt"
#     verify: true
#     timeout: 5
# }

# =============================================================================
# System Account (for monitoring)
# =============================================================================
system_account: "$SYS"

# =============================================================================
# Monitoring Configuration
# =============================================================================
http: "0.0.0.0:8222"

# =============================================================================
# Performance Tuning
# =============================================================================
# Disable slow consumer detection for high-throughput scenarios
slow_consumer_threshold: "10s"

# Write buffer size
write_buffer_size: 65536

# Enable profiling (disable in production)
prof_port: 0

# =============================================================================
# Stream Definitions for Quantum Nexus
# =============================================================================
# These will be created programmatically, but documented here for reference:
#
# Streams:
# - quantum_jobs: Job submissions and scheduling
# - quantum_results: Job results and outputs
# - quantum_events: System events and notifications
# - quantum_metrics: Performance and monitoring data
# - quantum_audit: Audit logs and compliance data
#
# Subjects:
# - quantum.jobs.submit
# - quantum.jobs.schedule
# - quantum.jobs.cancel
# - quantum.results.completed
# - quantum.results.failed
# - quantum.events.system
# - quantum.events.user
# - quantum.metrics.performance
# - quantum.metrics.usage
# - quantum.audit.access
# - quantum.audit.changes

# =============================================================================
# Resource Limits
# =============================================================================
limits {
    max_connections: 10000
    max_subscriptions: 100000
    max_payload: 8MB
    max_control_line: 4096
}

