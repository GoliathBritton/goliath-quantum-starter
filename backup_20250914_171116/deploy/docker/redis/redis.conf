# Quantum Nexus Platform - Redis Configuration
# Production-ready Redis configuration for session management and caching

# =============================================================================
# Network Configuration
# =============================================================================
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
tcp-keepalive 300

# =============================================================================
# General Configuration
# =============================================================================
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile "/data/redis.log"
databases 16

# =============================================================================
# Security Configuration
# =============================================================================
# Authentication
requirepass ${REDIS_PASSWORD}

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_b835c3f4d1a2e7b8"
rename-command DEBUG ""
rename-command EVAL ""
rename-command SHUTDOWN "SHUTDOWN_a7f8d9e2c4b6h1j3"

# =============================================================================
# Memory Management
# =============================================================================
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# =============================================================================
# Persistence Configuration
# =============================================================================
# RDB Snapshots
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename quantum-nexus.rdb
dir /data

# AOF (Append Only File)
appendonly yes
appendfilename "quantum-nexus.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# =============================================================================
# Replication Configuration
# =============================================================================
# Uncomment for master-slave setup
# slaveof <masterip> <masterport>
# masterauth <master-password>
# slave-serve-stale-data yes
# slave-read-only yes
# repl-diskless-sync no
# repl-diskless-sync-delay 5
# repl-ping-slave-period 10
# repl-timeout 60
# repl-disable-tcp-nodelay no
# repl-backlog-size 1mb
# repl-backlog-ttl 3600
# slave-priority 100
# min-slaves-to-write 0
# min-slaves-max-lag 10

# =============================================================================
# Client Configuration
# =============================================================================
timeout 300
tcp-keepalive 300
maxclients 10000

# =============================================================================
# Slow Log Configuration
# =============================================================================
slowlog-log-slower-than 10000
slowlog-max-len 128

# =============================================================================
# Latency Monitoring
# =============================================================================
latency-monitor-threshold 100

# =============================================================================
# Event Notification
# =============================================================================
notify-keyspace-events "Ex"

# =============================================================================
# Hash Configuration
# =============================================================================
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# =============================================================================
# List Configuration
# =============================================================================
list-max-ziplist-size -2
list-compress-depth 0

# =============================================================================
# Set Configuration
# =============================================================================
set-max-intset-entries 512

# =============================================================================
# Sorted Set Configuration
# =============================================================================
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# =============================================================================
# HyperLogLog Configuration
# =============================================================================
hll-sparse-max-bytes 3000

# =============================================================================
# Streams Configuration
# =============================================================================
stream-node-max-bytes 4096
stream-node-max-entries 100

# =============================================================================
# Active Rehashing
# =============================================================================
activerehashing yes

# =============================================================================
# Client Output Buffer Limits
# =============================================================================
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# =============================================================================
# Client Query Buffer
# =============================================================================
client-query-buffer-limit 1gb

# =============================================================================
# Protocol Buffer
# =============================================================================
proto-max-bulk-len 512mb

# =============================================================================
# Frequency of Rehashing
# =============================================================================
hz 10

# =============================================================================
# Dynamic HZ
# =============================================================================
dynamic-hz yes

# =============================================================================
# AOF Rewrite Incremental Fsync
# =============================================================================
aof-rewrite-incremental-fsync yes

# =============================================================================
# RDB Save Incremental Fsync
# =============================================================================
rdb-save-incremental-fsync yes

# =============================================================================
# LFU Configuration
# =============================================================================
lfu-log-factor 10
lfu-decay-time 1

# =============================================================================
# Quantum Nexus Specific Configuration
# =============================================================================
# Key naming conventions (documented for reference):
# - session:user:{user_id} - User session data
# - cache:quantum:{job_id} - Quantum job results cache
# - queue:jobs:{priority} - Job queues by priority
# - metrics:performance:{timestamp} - Performance metrics
# - config:system - System configuration cache
# - locks:resource:{resource_id} - Distributed locks
# - rate_limit:user:{user_id} - Rate limiting data
# - subscription:user:{user_id} - User subscription data
# - workflow:template:{template_id} - Workflow templates
# - agent:state:{agent_id} - Agent state data

# =============================================================================
# TLS Configuration (for production)
# =============================================================================
# Uncomment and configure for production TLS
# port 0
# tls-port 6380
# tls-cert-file /etc/redis/certs/redis.crt
# tls-key-file /etc/redis/certs/redis.key
# tls-ca-cert-file /etc/redis/certs/ca.crt
# tls-dh-params-file /etc/redis/certs/redis.dh
# tls-protocols "TLSv1.2 TLSv1.3"
# tls-ciphers "ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!aNULL:!MD5:!DSS"
# tls-ciphersuites "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256"
# tls-prefer-server-ciphers yes
# tls-session-caching no
# tls-session-cache-size 5000
# tls-session-cache-timeout 60

# =============================================================================
# Modules (if using Redis modules)
# =============================================================================
# loadmodule /usr/lib/redis/modules/redisearch.so
# loadmodule /usr/lib/redis/modules/redisjson.so
# loadmodule /usr/lib/redis/modules/redistimeseries.so

# =============================================================================
# Sentinel Configuration (for high availability)
# =============================================================================
# This would be in a separate sentinel.conf file
# sentinel monitor quantum-nexus-master 127.0.0.1 6379 2
# sentinel auth-pass quantum-nexus-master ${REDIS_PASSWORD}
# sentinel down-after-milliseconds quantum-nexus-master 30000
# sentinel parallel-syncs quantum-nexus-master 1
# sentinel failover-timeout quantum-nexus-master 180000

# =============================================================================
# Cluster Configuration (for horizontal scaling)
# =============================================================================
# Uncomment for Redis Cluster mode
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000
# cluster-announce-ip 10.1.1.5
# cluster-announce-port 6379
# cluster-announce-bus-port 16379

# =============================================================================
# Performance Tuning
# =============================================================================
# Disable transparent huge pages (set in Docker/K8s)
# echo never > /sys/kernel/mm/transparent_hugepage/enabled

# TCP backlog
# net.core.somaxconn = 65535

# Memory overcommit
# vm.overcommit_memory = 1

# =============================================================================
# Monitoring and Debugging
# =============================================================================
# Enable for debugging (disable in production)
# debug-mode no
# watchdog-period 0

# =============================================================================
# Jemalloc Configuration
# =============================================================================
# Set jemalloc background thread
# jemalloc-bg-thread yes

# =============================================================================
# End of Configuration
# =============================================================================