# FLYFOX AI - Production CI/CD Pipeline
# Comprehensive workflow for testing, building, and deploying to production

name: 🚀 FLYFOX Production Deploy

on:
  push:
    branches: [main, production]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force deployment (skip some checks)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-west-2
  EKS_CLUSTER_NAME: flyfox-production-eks
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com
  NAMESPACE: flyfox
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  TERRAFORM_VERSION: '1.6.0'

jobs:
  # ============================================================================
  # SECURITY AND QUALITY CHECKS
  # ============================================================================
  
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install security tools
        run: |
          pip install bandit safety semgrep
          npm install -g audit-ci
      
      - name: Run Bandit security scan
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . --severity-level medium
      
      - name: Run Safety check
        run: |
          pip freeze | safety check --json --output safety-report.json || true
          pip freeze | safety check
      
      - name: Run Semgrep
        run: |
          semgrep --config=auto --json --output=semgrep-report.json . || true
          semgrep --config=auto .
      
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            semgrep-report.json
  
  code-quality:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Install Node.js dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi
      
      - name: Run Black formatter check
        run: black --check --diff .
      
      - name: Run isort import check
        run: isort --check-only --diff .
      
      - name: Run flake8 linting
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Run mypy type checking
        run: mypy . --ignore-missing-imports || true
      
      - name: Run ESLint (if applicable)
        run: |
          if [ -f .eslintrc.js ] || [ -f .eslintrc.json ]; then
            npx eslint . --ext .js,.jsx,.ts,.tsx
          fi
  
  # ============================================================================
  # TESTING
  # ============================================================================
  
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
      
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage
  
  test-frontend:
    name: 🎨 Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi
      
      - name: Run frontend tests
        run: |
          if [ -f package.json ]; then npm test -- --coverage --watchAll=false; fi
      
      - name: Build frontend
        run: |
          if [ -f package.json ]; then npm run build; fi
  
  # ============================================================================
  # DOCKER BUILD AND PUSH
  # ============================================================================
  
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    
    strategy:
      matrix:
        service: [api, worker, quantum-worker, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/flyfox/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      
      - name: Image vulnerability scan
        run: |
          # Install Trivy
          sudo apt-get update
          sudo apt-get install wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy
          
          # Scan image
          trivy image --exit-code 0 --severity HIGH,CRITICAL ${{ env.ECR_REGISTRY }}/flyfox/${{ matrix.service }}:latest
  
  # ============================================================================
  # INFRASTRUCTURE DEPLOYMENT
  # ============================================================================
  
  deploy-infrastructure:
    name: 🏗️ Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init
      
      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan -var-file="production.tfvars" -out=tfplan
      
      - name: Terraform Apply
        working-directory: ./terraform
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply -auto-approve tfplan
  
  # ============================================================================
  # KUBERNETES DEPLOYMENT
  # ============================================================================
  
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
      
      - name: Deploy to staging namespace
        run: |
          # Create staging namespace if it doesn't exist
          kubectl create namespace flyfox-staging --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply configurations with staging overrides
          envsubst < k8s/namespace.yaml | kubectl apply -f -
          envsubst < k8s/configmap.yaml | kubectl apply -f -
          envsubst < k8s/secrets.yaml | kubectl apply -f -
          envsubst < k8s/database.yaml | kubectl apply -f -
          envsubst < k8s/api-deployment.yaml | kubectl apply -f -
          envsubst < k8s/worker-deployment.yaml | kubectl apply -f -
          envsubst < k8s/frontend-deployment.yaml | kubectl apply -f -
          
          # Wait for deployments to be ready
          kubectl wait --for=condition=available --timeout=600s deployment/flyfox-api -n flyfox-staging
          kubectl wait --for=condition=available --timeout=600s deployment/flyfox-frontend -n flyfox-staging
      
      - name: Run smoke tests
        run: |
          # Get service endpoints
          API_ENDPOINT=$(kubectl get svc flyfox-api -n flyfox-staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          # Wait for load balancer to be ready
          sleep 60
          
          # Basic health checks
          curl -f http://$API_ENDPOINT/health || exit 1
          echo "✅ Staging deployment successful!"
  
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, build-and-push]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
      
      - name: Pre-deployment checks
        run: |
          # Verify cluster connectivity
          kubectl cluster-info
          
          # Check node readiness
          kubectl get nodes
          
          # Verify namespace exists
          kubectl get namespace ${{ env.NAMESPACE }} || kubectl create namespace ${{ env.NAMESPACE }}
      
      - name: Deploy monitoring stack
        run: |
          kubectl apply -f k8s/monitoring.yaml
          
          # Wait for monitoring to be ready
          kubectl wait --for=condition=available --timeout=300s deployment/prometheus -n monitoring || true
          kubectl wait --for=condition=available --timeout=300s deployment/grafana -n monitoring || true
      
      - name: Deploy application
        run: |
          # Apply in order
          envsubst < k8s/namespace.yaml | kubectl apply -f -
          envsubst < k8s/configmap.yaml | kubectl apply -f -
          envsubst < k8s/secrets.yaml | kubectl apply -f -
          envsubst < k8s/database.yaml | kubectl apply -f -
          
          # Wait for database to be ready
          kubectl wait --for=condition=available --timeout=600s deployment/postgres -n ${{ env.NAMESPACE }} || true
          kubectl wait --for=condition=available --timeout=300s deployment/redis -n ${{ env.NAMESPACE }} || true
          
          # Deploy applications
          envsubst < k8s/api-deployment.yaml | kubectl apply -f -
          envsubst < k8s/worker-deployment.yaml | kubectl apply -f -
          envsubst < k8s/frontend-deployment.yaml | kubectl apply -f -
          
          # Wait for deployments to be ready
          kubectl wait --for=condition=available --timeout=600s deployment/flyfox-api -n ${{ env.NAMESPACE }}
          kubectl wait --for=condition=available --timeout=600s deployment/flyfox-worker -n ${{ env.NAMESPACE }}
          kubectl wait --for=condition=available --timeout=600s deployment/flyfox-quantum-worker -n ${{ env.NAMESPACE }}
          kubectl wait --for=condition=available --timeout=600s deployment/flyfox-frontend -n ${{ env.NAMESPACE }}
      
      - name: Post-deployment verification
        run: |
          # Check all pods are running
          kubectl get pods -n ${{ env.NAMESPACE }}
          
          # Get service endpoints
          kubectl get services -n ${{ env.NAMESPACE }}
          
          # Check ingress
          kubectl get ingress -n ${{ env.NAMESPACE }}
          
          echo "✅ Production deployment completed successfully!"
      
      - name: Run production smoke tests
        run: |
          # Wait for load balancer to be ready
          sleep 120
          
          # Get ingress endpoint
          INGRESS_ENDPOINT=$(kubectl get ingress flyfox-ingress -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          if [ ! -z "$INGRESS_ENDPOINT" ]; then
            # Test API health
            curl -f https://$INGRESS_ENDPOINT/api/health || echo "⚠️ API health check failed"
            
            # Test frontend
            curl -f https://$INGRESS_ENDPOINT/ || echo "⚠️ Frontend health check failed"
            
            echo "🎉 Production deployment verified!"
          else
            echo "⚠️ Ingress endpoint not ready yet"
          fi
  
  # ============================================================================
  # NOTIFICATIONS
  # ============================================================================
  
  notify-success:
    name: 📢 Notify Success
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: success()
    
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '🎉 FLYFOX Production deployment successful!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  
  notify-failure:
    name: 🚨 Notify Failure
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: failure()
    
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '🚨 FLYFOX Production deployment failed!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Create GitHub issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Production Deployment Failed',
              body: `Production deployment failed for commit ${context.sha}.\n\nWorkflow: ${context.workflow}\nRun: ${context.runNumber}\nActor: ${context.actor}`,
              labels: ['bug', 'production', 'deployment']
            })