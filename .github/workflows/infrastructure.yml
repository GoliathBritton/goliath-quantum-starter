name: Infrastructure Management

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/terraform/**'
      - '.github/workflows/infrastructure.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'deploy/terraform/**'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Infrastructure action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-west-2
  TF_VERSION: '1.6.0'
  TF_VAR_aws_region: us-west-2
  TF_VAR_environment: ${{ github.event.inputs.environment || 'staging' }}

jobs:
  # Terraform Validation and Security
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ./deploy/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./deploy/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./deploy/terraform
        run: terraform validate

      - name: Run tfsec security scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ./deploy/terraform
          format: sarif
          sarif_file: tfsec-results.sarif

      - name: Upload tfsec scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: tfsec-results.sarif

      - name: Run Checkov scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./deploy/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # Terraform Plan for Staging
  terraform-plan-staging:
    name: Terraform Plan (Staging)
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.ref != 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging-plan
    outputs:
      plan-output: ${{ steps.plan.outputs.stdout }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./deploy/terraform
        run: |
          terraform init \
            -backend-config="bucket=goliath-quantum-terraform-state-staging" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=goliath-quantum-terraform-locks-staging"

      - name: Terraform Plan
        id: plan
        working-directory: ./deploy/terraform
        run: |
          terraform plan \
            -var="environment=staging" \
            -var="cluster_name=goliath-quantum-cluster-staging" \
            -var="domain_name=staging.goliath-quantum.com" \
            -var="enable_monitoring=true" \
            -var="enable_backup=true" \
            -var="node_instance_types=[\"t3.medium\", \"t3.large\"]" \
            -var="min_nodes=2" \
            -var="max_nodes=10" \
            -var="desired_nodes=3" \
            -out=staging.tfplan
        env:
          TF_VAR_dynex_api_key: ${{ secrets.DYNEX_API_KEY_STAGING }}
          TF_VAR_database_password: ${{ secrets.DB_PASSWORD_STAGING }}
          TF_VAR_redis_auth_token: ${{ secrets.REDIS_AUTH_TOKEN_STAGING }}

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v3
        with:
          name: staging-terraform-plan
          path: deploy/terraform/staging.tfplan

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const output = `## 🏗️ Terraform Plan (Staging)
            
            <details>
            <summary>Show Plan</summary>
            
            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # Terraform Plan for Production
  terraform-plan-production:
    name: Terraform Plan (Production)
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.ref == 'refs/heads/main' && (github.event.inputs.environment == 'production' || github.event.inputs.environment == '')
    environment:
      name: production-plan
    outputs:
      plan-output: ${{ steps.plan.outputs.stdout }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./deploy/terraform
        run: |
          terraform init \
            -backend-config="bucket=goliath-quantum-terraform-state-prod" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=goliath-quantum-terraform-locks-prod"

      - name: Terraform Plan
        id: plan
        working-directory: ./deploy/terraform
        run: |
          terraform plan \
            -var="environment=production" \
            -var="cluster_name=goliath-quantum-cluster" \
            -var="domain_name=goliath-quantum.com" \
            -var="enable_monitoring=true" \
            -var="enable_backup=true" \
            -var="enable_multi_az=true" \
            -var="node_instance_types=[\"m5.large\", \"m5.xlarge\"]" \
            -var="min_nodes=3" \
            -var="max_nodes=20" \
            -var="desired_nodes=5" \
            -var="database_instance_class=db.r6g.large" \
            -var="redis_node_type=cache.r6g.large" \
            -out=production.tfplan
        env:
          TF_VAR_dynex_api_key: ${{ secrets.DYNEX_API_KEY_PROD }}
          TF_VAR_database_password: ${{ secrets.DB_PASSWORD_PROD }}
          TF_VAR_redis_auth_token: ${{ secrets.REDIS_AUTH_TOKEN_PROD }}

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v3
        with:
          name: production-terraform-plan
          path: deploy/terraform/production.tfplan

  # Terraform Apply for Staging
  terraform-apply-staging:
    name: Terraform Apply (Staging)
    runs-on: ubuntu-latest
    needs: terraform-plan-staging
    if: |
      (github.ref == 'refs/heads/main' && github.event.inputs.action == 'apply' && github.event.inputs.environment == 'staging') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: staging
      url: https://staging.goliath-quantum.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v3
        with:
          name: staging-terraform-plan
          path: deploy/terraform/

      - name: Terraform Init
        working-directory: ./deploy/terraform
        run: |
          terraform init \
            -backend-config="bucket=goliath-quantum-terraform-state-staging" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=goliath-quantum-terraform-locks-staging"

      - name: Terraform Apply
        working-directory: ./deploy/terraform
        run: terraform apply -auto-approve staging.tfplan

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name goliath-quantum-cluster-staging

      - name: Deploy Kubernetes manifests
        run: |
          # Apply cert-manager
          kubectl apply -f deploy/k8s/cert-manager.yaml
          
          # Apply external secrets
          kubectl apply -f deploy/k8s/external-secrets.yaml
          
          # Apply ingress controller
          kubectl apply -f deploy/k8s/ingress.yaml
          
          # Wait for controllers to be ready
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=cert-manager -n cert-manager --timeout=300s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=external-secrets -n external-secrets --timeout=300s
          
          # Apply application manifests
          kubectl apply -f deploy/k8s/application.yaml

      - name: Verify deployment
        run: |
          # Wait for application pods
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=api -n goliath-quantum --timeout=600s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=portal -n goliath-quantum --timeout=600s
          
          # Test health endpoints
          kubectl port-forward -n goliath-quantum svc/goliath-quantum-api 8080:8080 &
          sleep 10
          curl -f http://localhost:8080/health || exit 1

  # Terraform Apply for Production
  terraform-apply-production:
    name: Terraform Apply (Production)
    runs-on: ubuntu-latest
    needs: terraform-plan-production
    if: github.ref == 'refs/heads/main' && github.event.inputs.action == 'apply' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://goliath-quantum.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v3
        with:
          name: production-terraform-plan
          path: deploy/terraform/

      - name: Terraform Init
        working-directory: ./deploy/terraform
        run: |
          terraform init \
            -backend-config="bucket=goliath-quantum-terraform-state-prod" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=goliath-quantum-terraform-locks-prod"

      - name: Terraform Apply
        working-directory: ./deploy/terraform
        run: terraform apply -auto-approve production.tfplan

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name goliath-quantum-cluster

      - name: Deploy Kubernetes manifests
        run: |
          # Apply cert-manager
          kubectl apply -f deploy/k8s/cert-manager.yaml
          
          # Apply external secrets
          kubectl apply -f deploy/k8s/external-secrets.yaml
          
          # Apply ingress controller
          kubectl apply -f deploy/k8s/ingress.yaml
          
          # Wait for controllers to be ready
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=cert-manager -n cert-manager --timeout=300s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=external-secrets -n external-secrets --timeout=300s
          
          # Apply application manifests
          kubectl apply -f deploy/k8s/application.yaml

      - name: Verify deployment
        run: |
          # Wait for application pods
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=api -n goliath-quantum --timeout=600s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=portal -n goliath-quantum --timeout=600s
          
          # Test health endpoints
          API_URL=$(kubectl get ingress goliath-quantum-ingress -n goliath-quantum -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -f "https://${API_URL}/health" || exit 1

  # Terraform Destroy (Manual only)
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    environment:
      name: ${{ github.event.inputs.environment }}-destroy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./deploy/terraform
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            terraform init \
              -backend-config="bucket=goliath-quantum-terraform-state-prod" \
              -backend-config="key=production/terraform.tfstate" \
              -backend-config="region=${{ env.AWS_REGION }}" \
              -backend-config="dynamodb_table=goliath-quantum-terraform-locks-prod"
          else
            terraform init \
              -backend-config="bucket=goliath-quantum-terraform-state-staging" \
              -backend-config="key=staging/terraform.tfstate" \
              -backend-config="region=${{ env.AWS_REGION }}" \
              -backend-config="dynamodb_table=goliath-quantum-terraform-locks-staging"
          fi

      - name: Terraform Destroy
        working-directory: ./deploy/terraform
        run: |
          terraform destroy -auto-approve \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="cluster_name=goliath-quantum-cluster$([ "${{ github.event.inputs.environment }}" = "staging" ] && echo "-staging" || echo "")" \
            -var="domain_name=$([ "${{ github.event.inputs.environment }}" = "staging" ] && echo "staging.goliath-quantum.com" || echo "goliath-quantum.com")"
        env:
          TF_VAR_dynex_api_key: ${{ secrets[format('DYNEX_API_KEY_{0}', github.event.inputs.environment == 'production' && 'PROD' || 'STAGING')] }}
          TF_VAR_database_password: ${{ secrets[format('DB_PASSWORD_{0}', github.event.inputs.environment == 'production' && 'PROD' || 'STAGING')] }}
          TF_VAR_redis_auth_token: ${{ secrets[format('REDIS_AUTH_TOKEN_{0}', github.event.inputs.environment == 'production' && 'PROD' || 'STAGING')] }}

  # Cost Estimation
  cost-estimation:
    name: Cost Estimation
    runs-on: ubuntu-latest
    needs: [terraform-plan-staging, terraform-plan-production]
    if: always() && (needs.terraform-plan-staging.result == 'success' || needs.terraform-plan-production.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost estimate
        run: |
          if [ -f "deploy/terraform/staging.tfplan" ]; then
            infracost breakdown --path deploy/terraform/staging.tfplan --format json --out-file staging-costs.json
          fi
          
          if [ -f "deploy/terraform/production.tfplan" ]; then
            infracost breakdown --path deploy/terraform/production.tfplan --format json --out-file production-costs.json
          fi

      - name: Post cost comment
        if: github.event_name == 'pull_request'
        uses: infracost/actions/comment@v1
        with:
          path: "*-costs.json"
          behavior: update

  # Drift Detection
  drift-detection:
    name: Drift Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.action == 'drift-check'
    strategy:
      matrix:
        environment: [staging, production]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./deploy/terraform
        run: |
          if [ "${{ matrix.environment }}" = "production" ]; then
            terraform init \
              -backend-config="bucket=goliath-quantum-terraform-state-prod" \
              -backend-config="key=production/terraform.tfstate" \
              -backend-config="region=${{ env.AWS_REGION }}" \
              -backend-config="dynamodb_table=goliath-quantum-terraform-locks-prod"
          else
            terraform init \
              -backend-config="bucket=goliath-quantum-terraform-state-staging" \
              -backend-config="key=staging/terraform.tfstate" \
              -backend-config="region=${{ env.AWS_REGION }}" \
              -backend-config="dynamodb_table=goliath-quantum-terraform-locks-staging"
          fi

      - name: Check for drift
        id: drift
        working-directory: ./deploy/terraform
        run: |
          terraform plan -detailed-exitcode \
            -var="environment=${{ matrix.environment }}" \
            -var="cluster_name=goliath-quantum-cluster$([ "${{ matrix.environment }}" = "staging" ] && echo "-staging" || echo "")" \
            -var="domain_name=$([ "${{ matrix.environment }}" = "staging" ] && echo "staging.goliath-quantum.com" || echo "goliath-quantum.com")" \
            -out=drift-check.tfplan
        continue-on-error: true

      - name: Create drift issue
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          script: |
            const title = `🚨 Infrastructure Drift Detected - ${{ matrix.environment }}`;
            const body = `Infrastructure drift has been detected in the **${{ matrix.environment }}** environment.
            
            Please review the Terraform plan and take appropriate action:
            
            - Check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details
            - Review the drift and determine if it's expected
            - Apply the plan if the drift should be corrected
            - Update the Terraform configuration if the drift is intentional
            
            **Environment:** ${{ matrix.environment }}
            **Detected:** ${new Date().toISOString()}
            **Workflow:** ${context.workflow}
            **Run ID:** ${context.runId}`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['infrastructure', 'drift', '${{ matrix.environment }}']
            });