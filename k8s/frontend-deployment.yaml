apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyfox-frontend
  namespace: flyfox
  labels:
    app: flyfox-frontend
    component: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flyfox-frontend
  template:
    metadata:
      labels:
        app: flyfox-frontend
        component: frontend
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: frontend
        image: flyfox/frontend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.flyfox.ai"
        - name: NEXT_PUBLIC_WS_URL
          value: "wss://api.flyfox.ai"
        - name: NEXT_PUBLIC_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: flyfox-config
              key: ENVIRONMENT
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nextjs-cache
          mountPath: /.next
      volumes:
      - name: tmp
        emptyDir: {}
      - name: nextjs-cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flyfox-frontend-service
  namespace: flyfox
  labels:
    app: flyfox-frontend
spec:
  selector:
    app: flyfox-frontend
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flyfox-ingress
  namespace: flyfox
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-west-2:ACCOUNT:certificate/CERT-ID"
    alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS-1-2-2017-01"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:us-west-2:ACCOUNT:webacl/flyfox-waf/WAF-ID"
    alb.ingress.kubernetes.io/group.name: "flyfox"
spec:
  rules:
  - host: app.flyfox.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flyfox-frontend-service
            port:
              number: 80
  - host: api.flyfox.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flyfox-api-service
            port:
              number: 80
  tls:
  - hosts:
    - app.flyfox.ai
    - api.flyfox.ai