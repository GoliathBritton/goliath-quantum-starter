apiVersion: v1
kind: ConfigMap
metadata:
  name: flyfox-config
  namespace: flyfox
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "flyfox"
  API_VERSION: "v1"
  MAX_WORKERS: "10"
  QUEUE_NAME: "calling_queue"
  TWILIO_WEBHOOK_URL: "https://api.flyfox.ai/webhooks/twilio"
  COMPLIANCE_MODE: "strict"
  TCPA_ENABLED: "true"
  DNC_CHECK_ENABLED: "true"
  CALL_RECORDING_ENABLED: "true"
  QUANTUM_PRIORITY_QUEUE: "true"
  DYNEX_ENDPOINT: "https://dynex.flyfox.ai"
  MONITORING_ENABLED: "true"
  PROMETHEUS_PORT: "9090"
  GRAFANA_PORT: "3000"