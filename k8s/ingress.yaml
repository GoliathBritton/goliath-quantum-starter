apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flyfox-ingress
  namespace: flyfox
  labels:
    app: flyfox
    component: ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:ACCOUNT:certificate/CERT-ID
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      idle_timeout.timeout_seconds=60,
      routing.http2.enabled=true,
      access_logs.s3.enabled=true,
      access_logs.s3.bucket=flyfox-alb-logs,
      access_logs.s3.prefix=production
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - partners.flyfox.ai
    - api.flyfox.ai
    secretName: flyfox-tls
  rules:
  - host: partners.flyfox.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flyfox-frontend
            port:
              number: 80
  - host: api.flyfox.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flyfox-api
            port:
              number: 80
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: flyfox-api-internal
            port:
              number: 9090
      - path: /worker-metrics
        pathType: Prefix
        backend:
          service:
            name: flyfox-worker
            port:
              number: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flyfox-network-policy
  namespace: flyfox
spec:
  podSelector:
    matchLabels:
      app: flyfox-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: flyfox-frontend
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: flyfox-worker
    ports:
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9001
  - to: []
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 443   # HTTPS outbound
    - protocol: TCP
      port: 80    # HTTP outbound
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flyfox-worker-network-policy
  namespace: flyfox
spec:
  podSelector:
    matchLabels:
      app: flyfox-worker
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: flyfox-api
    ports:
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9001
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 443   # HTTPS outbound (Dynex, OpenAI, Twilio)
    - protocol: TCP
      port: 80    # HTTP outbound