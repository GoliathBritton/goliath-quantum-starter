# Kubernetes Deployment Configuration for Quantum Agent System
apiVersion: v1
kind: Namespace
metadata:
  name: quantum-agent
  labels:
    name: quantum-agent
    purpose: quantum-enhanced-ai

---
# ConfigMap for Environment Variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: quantum-agent-config
  namespace: quantum-agent
data:
  # qdLLM Worker Configuration
  QDLLM_SERVICE_NAME: "quantum-agent-qdllm"
  QDLLM_SERVICE_PORT: "8080"
  QDLLM_LOG_LEVEL: "INFO"
  QDLLM_MAX_WORKERS: "4"
  QDLLM_TIMEOUT: "300"
  
  # Quantum Job Manager Configuration
  QJM_SERVICE_NAME: "quantum-job-manager"
  QJM_SERVICE_PORT: "8081"
  QJM_QUEUE_SIZE: "1000"
  QJM_WORKER_THREADS: "8"
  
  # Dynex Configuration
  DYNEX_ENDPOINT: "https://api.dynexcoin.org"
  DYNEX_TIMEOUT: "60"
  DYNEX_MAX_RETRIES: "3"
  
  # Database Configuration
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "quantum_agent"
  DATABASE_USER: "quantum_user"
  
  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # Monitoring Configuration
  MONITORING_ENABLED: "true"
  METRICS_PORT: "9090"
  HEALTH_CHECK_INTERVAL: "30"
  
  # Security Configuration
  SECURITY_ENABLED: "true"
  CORS_ORIGINS: "*"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: quantum-agent-secrets
  namespace: quantum-agent
type: Opaque
data:
  # Base64 encoded secrets (replace with actual values)
  OPENAI_API_KEY: "