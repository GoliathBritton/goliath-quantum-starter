apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-portal
  namespace: partner-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: partner-portal
  template:
    metadata:
      labels:
        app: partner-portal
    spec:
      containers:
      - name: partner-portal
        image: <AWS_ACCOUNT>.dkr.ecr.us-east-1.amazonaws.com/flyfox-portal:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: API_URL
          value: "https://api.goliathomniedge.com"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10