apiVersion: apps/v1
kind: Deployment
metadata:
  name: nqba-sentinel
spec:
  replicas: 2
  selector:
    matchLabels: { app: nqba-sentinel }
  template:
    metadata:
      labels: { app: nqba-sentinel }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 5 }
